name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Preinstalled Android SDK & Licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          SDKMGR=""
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMGR="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$SDK_ROOT/tools/bin/sdkmanager" ]; then
            SDKMGR="$SDK_ROOT/tools/bin/sdkmanager"
          fi
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          fi

      - name: Install dependencies & build web bundle
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Setup Capacitor Android & Generate App Icons
        run: |
          npm install --legacy-peer-deps @capacitor/core@^6.2.0 @capacitor/cli@^6.2.0 @capacitor/android@^6.2.0 @capacitor/assets
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx capacitor-assets generate --android --iconBackgroundColor '#47c1fb' --splashBackgroundColor '#84c960' || true
          node -e '
            const fs = require("fs");
            const path = require("path");
            (async () => {
              let sharp;
              try { sharp = require("sharp"); } catch { return; }
              const resDir = path.join("android", "app", "src", "main", "res");
              const iconSrc = fs.existsSync("assets/icon-only.png") ? "assets/icon-only.png" : "public/app-icon.png";
              const fgSrc = fs.existsSync("assets/icon-foreground.png") ? "assets/icon-foreground.png" : iconSrc;
              if (!fs.existsSync(iconSrc) || !fs.existsSync(resDir)) return;
              const densities = [
                ["mipmap-mdpi", 48, 108],
                ["mipmap-hdpi", 72, 162],
                ["mipmap-xhdpi", 96, 216],
                ["mipmap-xxhdpi", 144, 324],
                ["mipmap-xxxhdpi", 192, 432]
              ];
              for (const [folder, legacySize, fgSize] of densities) {
                const dir = path.join(resDir, folder);
                fs.mkdirSync(dir, { recursive: true });
                await sharp(iconSrc).resize(legacySize, legacySize).png().toFile(path.join(dir, "ic_launcher.png"));
                await sharp(iconSrc).resize(legacySize, legacySize).png().toFile(path.join(dir, "ic_launcher_round.png"));
                await sharp(fgSrc).resize(fgSize, fgSize).png().toFile(path.join(dir, "ic_launcher_foreground.png"));
              }
            })();
          '
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Package APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./Ali-Island-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ali-Island-APK
          path: Ali-Island-debug.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ github.run_number }}
          name: Ali Island APK #${{ github.run_number }}
          body: "Automated offline Android APK build for Ali Island."
          files: Ali-Island-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
